name: Build EXE

on:
  push:
    branches: [ "main" ]
  release:
    types: [ created ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile --name fc5-save-converter src/converter.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fc5-save-converter-exe
          path: dist/fc5-save-converter.exe

      - name: Attach to release (если это релиз)
        if: github.event_name == 'release'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist/fc5-save-converter.exe
          tag: ${{ github.ref }}
          overwrite: true
          body: "Автоматически собранный .exe для Far Cry 5 Save Converter"
